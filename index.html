<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardápio | Deco Beer</title>
<style>
body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  background: #000;
  text-align: center;
  padding: 28px 12px;
  border-bottom: 3px solid #ffcc29;
}
h1 { margin: 0; font-size: 32px; }
h1 span { color: #ffcc29; }
header p { color: #ddd; }
main { padding: 18px; max-width: 700px; margin: auto; }
h2 {
  color: #ffcc29;
  border-bottom: 1px solid #ffcc29;
  padding-bottom: 10px;
}
.produto {
  background: #242424;
  padding: 18px;
  margin: 12px 0;
  border-radius: 12px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.preco { color: #ffcc29; font-weight: bold; }
footer { text-align: center; padding: 25px; }
</style>
</head>
<body>
<header>
<h1>DECO <span>BEER</span></h1>
<p>Cardápio Digital</p>
</header>
<main>
<h2>Cervejas 600 ml</h2>
<div class="produto">Heineken <span class="preco">R$ 13,99</span></div>
<div class="produto">Stella Pure Gold <span class="preco">R$ 14,99</span></div>
<div class="produto">Original <span class="preco">R$ 11,99</span></div>
<div class="produto">Skol <span class="preco">R$ 9,99</span></div>
<div class="produto">Amstel <span class="preco">R$ 9,99</span></div>
<h2>Petiscos</h2>
<div class="produto">Batata frita tradicional <span class="preco">R$ 25,99</span></div>
<div class="produto">Frango à passarinho <span class="preco">R$ 29,99</span></div>
</main>
<footer>Beba bons momentos na melhor!<p>Vem ser feliz!</p></footer>
</body>
</html>
